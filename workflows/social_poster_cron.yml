name: Daily Meta AI Social Media Auto-Poster

on:
  schedule:
    # 08:00 PM AST (Arabia Standard Time, UTC+3) = 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  post-daily-solution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Run Meta AI Poster
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://probashihub.com' }}
        run: |
          python scripts/meta_inbox_agent.py --mode post
